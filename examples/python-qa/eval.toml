# ---------------------------------------------------------------- chains
# Chained cases are Jev-decided: the model must affirm the __continue__ gate
# and plan step 2 correctly. Known-flaky: the gate sometimes declines or the
# second step repeats step 1 instead of switching commands.

[[test]]
name = "lint then format"
input = "first lint the code, then check formatting"
expected = ["ruff check", "ruff format --check"]
# Kept as a pinned known-failure: Jev plans step 1 fine (conf ~0.9) but the
# step-2 subcommand choice stalls at check-vs-format ~50/50 with conf
# 0.26–0.47, below the read bar however the __continue__ gate is set. Lowering
# min_confidence would paper over it; the harness correctly stops instead of
# executing a wrong/repeated step (P2 anti-repeat guard).

# ---------------------------------------------------------------- negatives
# Unsupported operations must abstain: no pip/venv, no debugger, no -k
# filtering (not an allowlisted flag), no python -c one-liners (the script
# slot requires an existing *.py file), no in-place formatting (format runs
# with --check only).

[[test]]
name = "pip install abstains"
input = "install the project dependencies with pip"
expect_abstain = true

[[test]]
name = "venv abstains"
input = "create a virtual environment"
expect_abstain = true

[[test]]
name = "upgrade abstains"
input = "upgrade all outdated pip packages"
expect_abstain = true

[[test]]
name = "debugger abstains"
input = "open a python debugger on the app"
expect_abstain = true

[[test]]
name = "oneliner abstains"
input = "run python with a one-liner to print hello"
expect_abstain = true

[[test]]
name = "format write abstains"
input = "format the app file in place"
expect_abstain = true

[[test]]
name = "nonsense abstains"
input = "launch the rockets to mars"
expect_abstain = true

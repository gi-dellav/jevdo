[meta]
# Defaults for every [[test]] in this file.
min_confidence = 0.5

# `expected` strings are single-shot (max_steps = 1); lists are multi-step
# (max_steps = len(expected)). Eval plans only — nothing executes.

# ---------------------------------------------------------------- pytest
[[test]]
name = "run tests"
input = "run tests"
expected = "pytest -q"

[[test]]
name = "run suite paraphrase"
input = "run the test suite for the app"
expected = "pytest -q"

[[test]]
name = "run tests stop early"
input = "run tests stopping at the first failure"
expected = "pytest -q -x"

[[test]]
name = "run tests short traceback"
input = "run tests with short traceback"
expected = "pytest -q --tb=short"

[[test]]
name = "run tests long traceback"
input = "run tests with full long tracebacks"
expected = "pytest -q --tb=long"

[[test]]
name = "run tests no traceback"
input = "run tests with no traceback output"
expected = "pytest -q --tb=no"

[[test]]
name = "run tests both flags"
input = "run tests stopping at the first failure with short tracebacks"
expected = "pytest -q -x --tb=short"


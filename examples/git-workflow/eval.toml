[[test]]
name = "copy utils into docs"
input = "copy src/utils.py to docs"
expected = "cp src/utils.py docs"

# ---------------------------------------------------------------- harder one-shots
# Tricky single-step cases: stacked flags under new phrasings, bare optional
# slots (flag off / path omitted), ambiguity that must resolve to "do the
# safe thing", and near-miss operations that must abstain.

[[test]]
name = "brief last ten"
input = "show the last 10 commits briefly"
expected = "git log --oneline --max-count=10"

[[test]]
name = "bare ls detail"

# ---------------------------------------------------------------- chains
# Chained cases are Jev-decided: the model must affirm the __continue__ gate
# and plan step 2 correctly. Known-flaky: the gate sometimes declines or the
# second step repeats step 1.

[[test]]
name = "stage then status"
input = "stage the src main python file then show status"
expected = ["git add src/main.py", "git status"]
# Jev's __continue__ gate hovers ~0.4 on this pair; 0.3 keeps the chain
# alive without touching the read/write confidence bars.
continue_threshold = 0.3

# ---------------------------------------------------------------- negatives
# Unsupported operations must abstain: no commit/push/stash/merge/checkout,
# no reset (not an allowlisted subcommand), no delete, no markdown staging
# (add slot is globbed to *.py).

[[test]]
name = "commit abstains"
input = "commit all staged changes with message fix it"
expect_abstain = true

[[test]]
name = "push abstains"
input = "push the current branch to origin"
expect_abstain = true

[[test]]
name = "stash abstains"
input = "stash my uncommitted changes"
expect_abstain = true

[[test]]
name = "merge abstains"
input = "merge the feature branch into main"
expect_abstain = true

[[test]]
name = "reset abstains"
input = "unstage all staged files"
expect_abstain = true

[[test]]
name = "delete abstains"
input = "delete the notes file"
expect_abstain = true

[[test]]
name = "stage markdown abstains"
input = "stage the notes markdown file"
expect_abstain = true

[[test]]
name = "nonsense abstains"
input = "launch the rockets to mars"
expect_abstain = true

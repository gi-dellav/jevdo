[meta]
# Defaults for every [[test]] in this file.
min_confidence = 0.5

# `expected` strings are single-shot (max_steps = 1); lists are multi-step
# (max_steps = len(expected)). Eval plans only — nothing executes.

# ---------------------------------------------------------------- core
[[test]]
name = "status"
input = "show git status"
expected = "git status"

[[test]]
name = "status paraphrase"
input = "check git working tree state"
expected = "git status"

[[test]]
name = "brief history"
input = "brief git history"
expected = "git log --oneline"

[[test]]
name = "bare history"
input = "show commits by giuseppe"
expected = "git log"

[[test]]
name = "last five commits"
input = "show the last 5 commits"
expected = "git log --max-count=5"

[[test]]
name = "brief last twenty"
input = "show the last 20 commits in compact form"
expected = "git log --oneline --max-count=20"

[[test]]
name = "diff stat"
input = "show diff stats"
expected = "git diff --stat"

[[test]]
name = "bare diff"
input = "show the current diff"
expected = "git diff"

[[test]]
name = "list branches"
input = "list git branches"
expected = "git branch"

[[test]]
name = "branches paraphrase"
input = "which branches exist"
expected = "git branch"

[[test]]
name = "all branches"
input = "list all git branches including remotes"
expected = "git branch -a"

[[test]]
name = "remotes shorthand"
input = "show remote branches too"
expected = "git branch -a"

# ---------------------------------------------------------------- paths
[[test]]
name = "stage main file"
input = "stage the src main python file"
expected = "git add src/main.py"

[[test]]
name = "stage utils file"
input = "stage the utils python file"
expected = "git add src/utils.py"

[[test]]
name = "list docs dir"
input = "list files in docs"
expected = "ls docs"

[[test]]
name = "copy main into docs"

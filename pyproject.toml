[project]
name = "jevdo"
version = "0.1.0"
description = "Jev, Do. | Connects Jev to your shell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typesafe-sdk>=0.7.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
jevdo = "jevdo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevdo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
